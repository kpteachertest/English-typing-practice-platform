<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Typing Challenge - 兒童英文打字大冒險</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Fredoka', 'Mochiy Pop One', cursive, sans-serif;
      background: linear-gradient(-45deg, #facc15, #38bdf8, #818cf8, #f472b6);
      background-size: 400% 400%;
      animation: fastPulseBG 3s ease infinite;
    }

    @keyframes fastPulseBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .cartoon-box {
      border: 4px solid #0f172a;
      box-shadow: 4px 4px 0px 0px #0f172a;
      animation: neonGlowFast 0.5s infinite alternate ease-in-out;
    }

    .super-glow {
      box-shadow: 0 0 25px #facc15, 0 0 10px #f59e0b;
      animation: goldGlow 0.8s infinite alternate ease-in-out !important;
    }

    @keyframes goldGlow {
      0% { transform: scale(1); box-shadow: 0 0 15px #facc15, 4px 4px 0px 0px #0f172a; }
      100% { transform: scale(1.05); box-shadow: 0 0 30px #f59e0b, 0 0 15px #f43f5e, 4px 4px 0px 0px #0f172a; }
    }

    @keyframes neonGlowFast {
      0% { box-shadow: 4px 4px 0px 0px #0f172a, 0 0 10px rgba(255, 230, 0, 0.6); }
      100% { box-shadow: 4px 4px 0px 0px #0f172a, 0 0 20px rgba(255, 0, 127, 0.8); }
    }
    
    .cartoon-btn {
      border: 4px solid #0f172a;
      box-shadow: 0px 4px 0px 0px #0f172a;
      transition: all 0.05s ease;
    }
    .cartoon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0px 6px 0px 0px #0f172a;
    }
    .cartoon-btn:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 0px 0px #0f172a;
    }

    @keyframes cartoonPop {
      0% { transform: scale(0.9) rotate(-1deg); opacity: 0; }
      50% { transform: scale(1.02) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-cartoon-pop {
      animation: cartoonPop 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes taikoCombo {
      0% { transform: translate(-50%, -50%) scale(0.3) rotate(-12deg); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.4) rotate(6deg); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.1) rotate(-3deg); opacity: 1; }
      100% { transform: translate(-50%, -80px) scale(1) rotate(0deg); opacity: 0; }
    }
    
    .taiko-combo-text {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Mochiy Pop One', cursive, sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: #facc15;
      -webkit-text-stroke: 3px #0f172a;
      text-shadow: 4px 4px 0px #f43f5e, 8px 8px 0px #0f172a;
      animation: taikoCombo 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #0f172a; border-radius: 10px; }
  </style>
</head>
<body class="font-sans h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none overflow-hidden relative">

  <!-- 1. 首頁 -->
  <div id="welcome-screen" class="text-center bg-white p-6 sm:p-8 rounded-3xl cartoon-box w-full max-w-xl my-auto animate-cartoon-pop relative z-20">
    
    <!-- 📅 當週戰績摘要卡 -->
    <div class="bg-gradient-to-br from-pink-200 to-rose-200 rounded-2xl p-4 mb-4 cartoon-box border-4 border-slate-900 shadow-[0_0_15px_rgba(244,63,94,0.4)] transform hover:scale-[1.02] transition-transform">
      <div class="flex justify-between items-center pb-2 mb-3 border-b-4 border-slate-900 text-sm sm:text-base font-black text-slate-800">
        <span id="current-week-label" class="text-rose-700 drop-shadow-sm text-lg">📅 本週打字戰績</span>
        <span class="text-xs text-slate-600 bg-white px-2 py-1 rounded-full border-2 border-slate-900">雲端同步</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3 rounded-xl border-4 border-slate-900 text-left">
          <span class="text-xs sm:text-sm text-slate-500 font-black block mb-1">⭐ 本週獲得積分</span>
          <span id="home-week-score" class="text-3xl sm:text-4xl font-black text-rose-600 drop-shadow">0 分</span>
        </div>
        <div class="bg-white p-3 rounded-xl border-4 border-slate-900 text-left">
          <span class="text-xs sm:text-sm text-slate-500 font-black block mb-1">⚡ 本週最快速度</span>
          <span id="home-week-wpm" class="text-3xl sm:text-4xl font-black text-emerald-600 drop-shadow">0 WPM</span>
        </div>
      </div>
    </div>

    <!-- 學生身分狀態欄 -->
    <div id="current-student-bar" class="bg-indigo-100 rounded-2xl p-2.5 mb-3 flex justify-between items-center px-4 cartoon-box hidden">
      <span class="text-slate-900 font-black text-xs sm:text-sm">👤 冒險者身分：<span id="display-student-identity" class="text-indigo-700 font-black text-base">未登錄</span></span>
      <button onclick="reSelectStudent()" class="bg-amber-300 hover:bg-amber-200 text-slate-900 font-black px-2.5 py-1 rounded-xl cartoon-btn text-xs">
        ✏️ 修改身分
      </button>
    </div>

    <!-- 🌟 冒險者等級與進化形態 -->
    <div class="bg-amber-100 rounded-2xl p-3 mb-4 cartoon-box relative overflow-hidden">
      <div class="text-[11px] sm:text-xs font-black text-slate-600 uppercase tracking-wider mb-2">🌟 累積總積分與進化形態</div>
      <div class="flex items-center justify-center space-x-4 mb-2">
        <div id="avatar-container" class="text-4xl sm:text-5xl bg-white p-2 rounded-xl cartoon-box">
          <span id="user-badge-icon">🐣</span>
        </div>
        <div class="text-left">
          <div class="flex items-baseline space-x-1">
            <span id="user-total-score" class="text-2xl sm:text-3xl font-black text-indigo-600 drop-shadow-sm">0</span>
            <span class="text-sm text-slate-800 font-black">分</span>
          </div>
          <div class="text-xs sm:text-sm font-black text-slate-800" id="user-rank-title">稱號：打字新手</div>
        </div>
      </div>
      <div class="w-full bg-white rounded-full h-3 mt-1 border-2 border-slate-900 overflow-hidden relative">
        <div id="rank-progress" class="bg-gradient-to-r from-yellow-400 to-amber-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="text-[10px] text-slate-700 mt-1.5 font-black" id="next-rank-info">載入中...</div>
    </div>

    <h1 class="text-2xl sm:text-4xl font-black text-indigo-600 mb-2 tracking-wide drop-shadow-[2px_2px_0px_#0f172a]">🎮 2分鐘打字大冒險</h1>
    <p class="text-xs sm:text-sm text-slate-600 mb-4 font-black">請選擇冒險關卡：</p>

    <div class="space-y-3">
      <button onclick="promptStudentInfo('g2')" class="w-full bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black text-lg sm:text-xl py-3 rounded-2xl cartoon-btn flex items-center justify-center space-x-2">
        <span>🖐️ 二年級：肌肉記憶關卡</span>
      </button>

      <button onclick="promptStudentInfo('g3')" class="w-full bg-purple-400 hover:bg-purple-300 text-slate-900 font-black text-lg sm:text-xl py-3 rounded-2xl cartoon-btn flex items-center justify-center space-x-2">
        <span>📖 三年級：極速短文挑戰</span>
      </button>

      <div class="grid grid-cols-3 gap-2 pt-1">
        <button onclick="openMonthlyModal()" class="bg-emerald-300 hover:bg-emerald-200 text-slate-900 font-black py-2.5 rounded-2xl cartoon-btn text-xs sm:text-sm flex items-center justify-center space-x-1">
          <span>🏆 龍虎榜排名</span>
        </button>
        <button onclick="openBadgeModal()" class="bg-sky-300 hover:bg-sky-200 text-slate-900 font-black py-2.5 rounded-2xl cartoon-btn text-xs sm:text-sm flex items-center justify-center space-x-1">
          <span>🏅 勳章與技能</span>
        </button>
        <button onclick="openHistoryModal()" class="bg-orange-300 hover:bg-orange-200 text-slate-900 font-black py-2.5 rounded-2xl cartoon-btn text-xs sm:text-sm flex items-center justify-center space-x-1">
          <span>📜 歷史戰報</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 學生選擇彈窗 -->
  <div id="student-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 sm:p-8 rounded-3xl cartoon-box max-w-sm w-full text-center animate-cartoon-pop relative">
      <h3 id="student-modal-title" class="text-xl sm:text-2xl font-black text-indigo-600 mb-4">🏫 請選擇年級與班級學號</h3>
      
      <div class="space-y-4 text-left mb-6 font-black">
        <div>
          <label class="block text-slate-700 mb-1 text-sm">選擇年級：</label>
          <select id="select-grade-mode" onchange="onGradeModeChange()" class="w-full p-2.5 rounded-xl border-4 border-slate-900 font-black text-slate-800 bg-amber-50 cartoon-box focus:outline-none">
            <option value="g2">🖐️ 二年級 (肌肉記憶關卡)</option>
            <option value="g3">📖 三年級 (極速短文挑戰)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-700 mb-1 text-sm">選擇班級：</label>
          <select id="select-class" class="w-full p-2.5 rounded-xl border-4 border-slate-900 font-black text-slate-800 bg-amber-50 cartoon-box focus:outline-none"></select>
        </div>
        <div>
          <label class="block text-slate-700 mb-1 text-sm">選擇學號：</label>
          <select id="select-seat" class="w-full p-2.5 rounded-xl border-4 border-slate-900 font-black text-slate-800 bg-amber-50 cartoon-box focus:outline-none"></select>
        </div>
      </div>

      <div class="flex space-x-2">
        <button onclick="closeStudentModal()" class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-900 font-black py-2.5 rounded-xl cartoon-btn text-sm">取消</button>
        <button onclick="showConfirmModal()" class="w-2/3 bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black py-2.5 rounded-xl cartoon-btn text-sm">下一步 🚀</button>
      </div>
    </div>
  </div>

  <!-- 二次確認彈窗 -->
  <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-[60]">
    <div class="bg-white p-6 sm:p-8 rounded-3xl cartoon-box max-w-sm w-full text-center animate-cartoon-pop relative">
      <div class="text-4xl mb-2">👤</div>
      <h3 class="text-xl font-black text-slate-900 mb-3">確認您的冒險者身份</h3>
      
      <div class="bg-amber-100 p-4 rounded-2xl cartoon-box mb-5 text-center">
        <p class="text-2xl font-black text-indigo-700" id="confirm-identity-text">P2A - 1 號</p>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="backToSelectModal()" class="bg-rose-300 hover:bg-rose-200 text-slate-900 font-black py-2.5 px-3 rounded-xl cartoon-btn text-xs">✏️ 修改身份</button>
        <button onclick="confirmStudentAndStart()" class="bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black py-2.5 px-3 rounded-xl cartoon-btn text-xs">🚀 開始遊戲！</button>
      </div>
    </div>
  </div>

  <!-- 🏆 龍虎榜排名與完整排行榜查詢視窗 -->
  <div id="monthly-stats-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-white p-4 sm:p-6 rounded-3xl cartoon-box max-w-lg w-full flex flex-col max-h-[90vh] animate-cartoon-pop">
      <div class="flex justify-between items-center pb-2 border-b-4 border-slate-900 mb-3">
        <h3 class="text-xl sm:text-2xl font-black text-slate-900">🏆 冒險者總龍虎榜</h3>
        <button onclick="closeMonthlyModal()" class="text-slate-900 text-2xl font-black hover:text-rose-600 transition">&times;</button>
      </div>
      
      <!-- 個人排名摘要卡 -->
      <div id="monthly-student-summary" class="bg-amber-100 cartoon-box p-3 rounded-2xl mb-3 flex justify-between items-center">
        <div class="text-left font-black">
          <div class="text-xs text-slate-600">👤 冒險者</div>
          <div id="summary-identity" class="text-sm sm:text-base text-indigo-700">--</div>
        </div>
        <div class="text-right font-black">
          <div class="text-xs text-slate-600">👑 個人排名</div>
          <div id="summary-rank" class="text-base sm:text-lg text-rose-600">--</div>
        </div>
      </div>

      <!-- 全級排行榜列表 -->
      <div id="monthly-stats-list" class="overflow-y-auto space-y-2 pr-1 flex-1 custom-scrollbar">
        <p class="text-center text-slate-400 py-8 font-black">正在向雲端讀取龍虎榜與排行榜...</p>
      </div>

      <button onclick="closeMonthlyModal()" class="mt-3 w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-black py-2.5 rounded-2xl cartoon-btn text-sm">
        返回選單
      </button>
    </div>
  </div>

  <!-- 2. 遊戲主畫面 -->
  <div id="game-screen" class="hidden bg-white p-3 sm:p-5 rounded-3xl cartoon-box w-full max-w-6xl h-full max-h-[96vh] flex-col justify-between relative overflow-hidden z-20">
    <div class="flex justify-between items-center pb-2 mb-3 border-b-4 border-slate-900 flex-shrink-0">
      <div class="flex items-center space-x-2">
        <span id="mode-badge" class="bg-yellow-300 text-slate-900 border-3 border-slate-900 px-3 py-1 rounded-xl font-black text-xs sm:text-sm shadow-[2px_2px_0px_0px_#0f172a]"></span>
        <span id="student-info-badge" class="bg-indigo-300 text-slate-900 border-3 border-slate-900 px-3 py-1 rounded-xl font-black text-xs sm:text-sm shadow-[2px_2px_0px_0px_#0f172a]"></span>
        <span id="ingame-avatar" class="text-2xl animate-bounce">🐣</span>
      </div>
      <div class="text-lg sm:text-2xl font-black text-white bg-rose-500 px-4 py-1 rounded-xl cartoon-box flex items-center space-x-1.5 animate-pulse">
        <span>⏱️</span> <span id="timer">02:00</span>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 flex-1 min-h-0 items-stretch">
      <div class="md:col-span-2 flex flex-col space-y-3 h-full min-h-0 relative">
        <div id="combo-container" class="absolute inset-0 pointer-events-none z-30"></div>

        <div id="target-box" class="bg-sky-100 p-3 sm:p-4 rounded-2xl cartoon-box flex-1 flex flex-col justify-start min-h-[140px] relative overflow-hidden">
          <p class="text-xs font-black text-sky-800 mb-1 flex-shrink-0">🎯 請完整輸入以下內容（無需按 Enter 換行）：</p>
          <div id="target-display" class="text-lg sm:text-2xl font-black tracking-wide text-slate-800 leading-relaxed break-words font-mono whitespace-pre-wrap overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
        </div>

        <textarea id="type-input" 
                  autocomplete="off" 
                  autocorrect="off" 
                  autocapitalize="none" 
                  spellcheck="false" 
                  placeholder="👉 直接敲擊鍵盤字母開始，無需切換英文輸入法..." 
                  class="w-full flex-1 text-lg sm:text-2xl p-3 sm:p-4 border-4 border-slate-900 focus:border-indigo-600 rounded-2xl focus:outline-
